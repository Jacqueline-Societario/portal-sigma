{% extends 'base.html' %}
{% block title %}Painel de Avisos{% endblock %}

{% block content %}
<div class="page-header">
  <div>
    <h1 class="page-title">Painel de Avisos</h1>
    <p class="page-desc">Comunicados internos para a equipe do Societário.</p>
  </div>
  <button class="btn btn-primary" id="btnNovoAviso">
    <i data-lucide="plus" style="width:15px;height:15px;margin-right:6px;"></i>Novo Aviso
  </button>
</div>

<!-- Tabela de avisos -->
<div class="card" style="margin-top:20px;">
  <div style="overflow-x:auto;">
    <table class="table" id="tabelaAvisos">
      <thead>
        <tr>
          <th>Tipo</th>
          <th>Título</th>
          <th style="text-align:center;">Ativo</th>
          <th style="text-align:center;">Rodízio</th>
          <th>Expira em</th>
          <th>Criado em</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody id="tbodyAvisos">
        <tr><td colspan="7" style="text-align:center;color:var(--muted);padding:28px;">Carregando...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<!-- Modal criar/editar -->
<div id="modalAviso" class="modal-overlay" style="display:none;">
  <div class="modal-box" style="max-width:520px;">
    <div class="modal-header">
      <span id="modalTitulo">Novo Aviso</span>
      <button class="modal-close" id="btnFecharModal">&times;</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="avisoId" value="">

      <div class="form-group">
        <label class="form-label">Título *</label>
        <input type="text" class="form-control" id="fTitulo" placeholder="Ex: Prazo DAS — vence 20/07" maxlength="200">
      </div>

      <div class="form-group">
        <label class="form-label">Tipo</label>
        <select class="form-control" id="fTipo">
          <option value="urgente">Urgente</option>
          <option value="prazo">Prazo</option>
          <option value="importante">Importante</option>
          <option value="aviso" selected>Aviso</option>
          <option value="procedimento">Procedimento</option>
          <option value="sistema">Sistema</option>
          <option value="dica">Dica</option>
        </select>
      </div>

      <div class="form-group">
        <label class="form-label">Corpo</label>
        <textarea class="form-control" id="fCorpo" rows="4" placeholder="Detalhes do comunicado (opcional)..."></textarea>
      </div>

      <div class="form-group">
        <label class="form-label">Link (opcional)</label>
        <input type="url" class="form-control" id="fLink" placeholder="https://...">
      </div>

      <div class="form-group">
        <label class="form-label">Expira em (opcional)</label>
        <input type="date" class="form-control" id="fExpiracao">
      </div>

      <div style="display:flex;gap:24px;margin-top:4px;">
        <label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-size:14px;">
          <input type="checkbox" id="fAtivo" checked> Ativo
        </label>
        <label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-size:14px;">
          <input type="checkbox" id="fRodizio" checked> Incluir no rodízio
        </label>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" id="btnCancelar">Cancelar</button>
      <button class="btn btn-primary" id="btnSalvar">Salvar</button>
    </div>
  </div>
</div>

<style>
  .aviso-tipo-badge {
    display: inline-block;
    padding: 2px 9px;
    border-radius: 99px;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .4px;
  }
  .toggle-switch { position:relative; display:inline-block; width:36px; height:20px; }
  .toggle-switch input { opacity:0; width:0; height:0; }
  .toggle-slider {
    position:absolute; cursor:pointer; top:0; left:0; right:0; bottom:0;
    background:#ccc; border-radius:20px; transition:.2s;
  }
  .toggle-slider:before {
    position:absolute; content:''; height:14px; width:14px;
    left:3px; bottom:3px; background:white; border-radius:50%; transition:.2s;
  }
  .toggle-switch input:checked + .toggle-slider { background:var(--primary, #A72C31); }
  .toggle-switch input:checked + .toggle-slider:before { transform:translateX(16px); }
  .modal-overlay {
    position:fixed; inset:0; background:rgba(0,0,0,.45);
    display:flex; align-items:center; justify-content:center; z-index:9000;
  }
  .modal-box {
    background:var(--surface, #fff); border-radius:12px;
    width:92%; box-shadow:0 8px 40px rgba(0,0,0,.18);
  }
  .modal-header {
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 22px 14px; border-bottom:1px solid var(--border,#e5e7eb);
    font-weight:700; font-size:16px;
  }
  .modal-close { background:none; border:none; font-size:22px; cursor:pointer; color:var(--muted); }
  .modal-body { padding:20px 22px; display:flex; flex-direction:column; gap:14px; }
  .modal-footer { padding:14px 22px 18px; display:flex; justify-content:flex-end; gap:10px; border-top:1px solid var(--border,#e5e7eb); }
  .form-group { display:flex; flex-direction:column; gap:5px; }
  .form-label { font-size:13px; font-weight:600; color:var(--text,#333); }
  .form-control {
    padding:8px 10px; border:1px solid var(--border,#d1d5db);
    border-radius:7px; font-size:14px; background:var(--bg,#fff);
    color:var(--text,#333); outline:none; transition:border-color .15s;
  }
  .form-control:focus { border-color:var(--primary,#A72C31); }
</style>

<script>
const TIPO_COR = {
  urgente:    { bg:'#fee2e2', color:'#b91c1c' },
  importante: { bg:'#ffedd5', color:'#ea580c' },
  aviso:      { bg:'#fef9c3', color:'#d97706' },
  dica:       { bg:'#dcfce7', color:'#16a34a' },
  sistema:    { bg:'#dbeafe', color:'#2563eb' },
  procedimento:{ bg:'#ede9fe', color:'#7c3aed' },
  prazo:      { bg:'#fce7f3', color:'#db2777' },
};

function tipoBadge(tipo) {
  const c = TIPO_COR[tipo] || { bg:'#f3f4f6', color:'#374151' };
  return `<span class="aviso-tipo-badge" style="background:${c.bg};color:${c.color};">${tipo}</span>`;
}

function toggleHtml(avisoId, campo, checked) {
  return `<label class="toggle-switch">
    <input type="checkbox" ${checked ? 'checked' : ''} onchange="toggleCampo(${avisoId},'${campo}',this.checked)">
    <span class="toggle-slider"></span>
  </label>`;
}

async function carregarAvisos() {
  const tbody = document.getElementById('tbodyAvisos');
  try {
    const r = await fetch('/avisos/api');
    const avisos = await r.json();
    if (!avisos.length) {
      tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;color:var(--muted);padding:28px;">Nenhum aviso cadastrado.</td></tr>';
      return;
    }
    tbody.innerHTML = avisos.map(a => `
      <tr>
        <td>${tipoBadge(a.tipo)}</td>
        <td style="max-width:260px;">
          <div style="font-weight:600;font-size:14px;">${_esc(a.titulo)}</div>
          ${a.link ? `<div style="font-size:11px;color:var(--muted);margin-top:2px;"><a href="${_esc(a.link)}" target="_blank">${_esc(a.link)}</a></div>` : ''}
        </td>
        <td style="text-align:center;">${toggleHtml(a.id, 'ativo', a.ativo)}</td>
        <td style="text-align:center;">${toggleHtml(a.id, 'rodizio', a.rodizio)}</td>
        <td style="font-size:13px;color:var(--muted);">${a.data_expiracao || '—'}</td>
        <td style="font-size:12px;color:var(--muted);">${(a.criado_em||'').slice(0,10)}</td>
        <td>
          <button class="btn btn-sm btn-secondary" onclick="abrirEditar(${a.id})" title="Editar">
            <i data-lucide="pencil" style="width:13px;height:13px;"></i>
          </button>
          <button class="btn btn-sm" style="background:#fee2e2;color:#b91c1c;margin-left:4px;" onclick="excluir(${a.id},'${_esc(a.titulo)}')" title="Excluir">
            <i data-lucide="trash-2" style="width:13px;height:13px;"></i>
          </button>
        </td>
      </tr>
    `).join('');
    if (typeof lucide !== 'undefined') lucide.createIcons();
  } catch(e) {
    tbody.innerHTML = '<tr><td colspan="7" style="color:#b91c1c;padding:18px;">Erro ao carregar avisos.</td></tr>';
  }
}

function _esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

async function toggleCampo(avisoId, campo, checked) {
  await fetch(`/avisos/api/${avisoId}/toggle`, {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ campo, valor: checked ? 1 : 0 })
  });
}

function abrirModal(aviso=null) {
  document.getElementById('avisoId').value = aviso ? aviso.id : '';
  document.getElementById('modalTitulo').textContent = aviso ? 'Editar Aviso' : 'Novo Aviso';
  document.getElementById('fTitulo').value = aviso ? aviso.titulo : '';
  document.getElementById('fTipo').value = aviso ? aviso.tipo : 'aviso';
  document.getElementById('fCorpo').value = aviso ? (aviso.corpo||'') : '';
  document.getElementById('fLink').value = aviso ? (aviso.link||'') : '';
  document.getElementById('fExpiracao').value = aviso ? (aviso.data_expiracao||'') : '';
  document.getElementById('fAtivo').checked = aviso ? Boolean(aviso.ativo) : true;
  document.getElementById('fRodizio').checked = aviso ? Boolean(aviso.rodizio) : true;
  document.getElementById('modalAviso').style.display = 'flex';
}

async function abrirEditar(avisoId) {
  const r = await fetch(`/avisos/api`);
  const lista = await r.json();
  const aviso = lista.find(a => a.id === avisoId);
  if (aviso) abrirModal(aviso);
}

function fecharModal() {
  document.getElementById('modalAviso').style.display = 'none';
}

async function salvar() {
  const id = document.getElementById('avisoId').value;
  const payload = {
    titulo: document.getElementById('fTitulo').value.trim(),
    tipo:   document.getElementById('fTipo').value,
    corpo:  document.getElementById('fCorpo').value.trim(),
    link:   document.getElementById('fLink').value.trim(),
    data_expiracao: document.getElementById('fExpiracao').value || null,
    ativo:  document.getElementById('fAtivo').checked ? 1 : 0,
    rodizio: document.getElementById('fRodizio').checked ? 1 : 0,
  };
  if (!payload.titulo) { alert('Informe o título.'); return; }
  const url  = id ? `/avisos/api/${id}` : '/avisos/api';
  const meth = id ? 'PUT' : 'POST';
  const r = await fetch(url, { method:meth, headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload) });
  if (r.ok) { fecharModal(); carregarAvisos(); }
  else { const d=await r.json(); alert(d.erro || 'Erro ao salvar.'); }
}

async function excluir(avisoId, titulo) {
  if (!confirm(`Excluir aviso "${titulo}"?`)) return;
  await fetch(`/avisos/api/${avisoId}`, { method:'DELETE' });
  carregarAvisos();
}

document.getElementById('btnNovoAviso').addEventListener('click', () => abrirModal());
document.getElementById('btnFecharModal').addEventListener('click', fecharModal);
document.getElementById('btnCancelar').addEventListener('click', fecharModal);
document.getElementById('btnSalvar').addEventListener('click', salvar);
document.getElementById('modalAviso').addEventListener('click', e => { if (e.target===e.currentTarget) fecharModal(); });

carregarAvisos();
</script>
{% endblock %}
